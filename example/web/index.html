<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>velvet-rope notes</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0 auto;
        max-width: 40rem;
        padding: 1rem;
      }
      button,
      input,
      select {
        min-height: 44px;
        font: inherit;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      ul {
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.5rem;
      }
      li {
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        border-radius: 8px;
        padding: 0.5rem 0.75rem;
      }
      .muted {
        opacity: 0.7;
        font-size: 0.9em;
      }
      .error {
        color: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        .error {
          color: #ffb4ab;
        }
      }
    </style>
  </head>
  <body>
    <h1>velvet-rope notes</h1>
    <main id="app"></main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
